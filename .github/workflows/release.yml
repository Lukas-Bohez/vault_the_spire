# GitHub Actions release workflow for Vault The Spire
# Manually triggered with workflow_dispatch.
#
# WHY THE ANDROID SDK STEP WAS REMOVED:
#   android-36 + build-tools;36.0.0 are preinstalled on ubuntu-latest (Ubuntu 24.04).
#   Manually calling sdkmanager was crashing with exit code 1 because the runner image
#   layout changed when ubuntu-latest moved to 24.04. Flutter/Gradle find the SDK
#   automatically via ANDROID_HOME which the runner sets already.
#
# Action versions (Node 24 compatible, as of March 2026):
#   actions/checkout@v4          – current stable
#   actions/upload-artifact@v6   – Node 24 native
#   actions/download-artifact@v4 – Node 24 native
#   actions/setup-java@v4        – current stable
#   subosito/flutter-action@v2   – current stable
#   softprops/action-gh-release@v2 – current stable

name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string
      release_name:
        description: 'Release name (e.g. "Vault The Spire v1.2.3")'
        required: true
        type: string
      release_notes:
        description: 'Release notes (Markdown)'
        required: true
        type: string
      is_prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: '3.41.2'
  OUTPUT_NAME: VaultTheSpire

jobs:
  test-and-analyze:
    name: Test and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build-windows:
    name: Build Windows
    needs: test-and-analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --no-tree-shake-icons

      - name: Package Windows build
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (!(Test-Path $src)) { Write-Error "Build output not found: $src"; exit 1 }
          Compress-Archive -Path "$src\*" -DestinationPath "${{ env.OUTPUT_NAME }}-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: ${{ env.OUTPUT_NAME }}-windows-x64.zip

  build-linux:
    name: Build Linux
    needs: test-and-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libssl-dev \
            libayatana-appindicator3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release --no-tree-shake-icons

      - name: Package Linux zip
        run: |
          set -euo pipefail
          BUNDLE="$GITHUB_WORKSPACE/build/linux/x64/release/bundle"
          if [ ! -d "$BUNDLE" ]; then echo "ERROR: bundle not found: $BUNDLE"; exit 1; fi
          cd "$BUNDLE"
          zip -r "$GITHUB_WORKSPACE/${{ env.OUTPUT_NAME }}-linux-x64.zip" .

      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64
          path: ${{ env.OUTPUT_NAME }}-linux-x64.zip

  build-macos:
    name: Build macOS
    needs: test-and-analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release --no-tree-shake-icons

      - name: Package macOS build
        run: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "ERROR: .app bundle not found"; exit 1; fi
          ditto -c -k --keepParent "$APP" "${{ env.OUTPUT_NAME }}-macOS.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: macos-x64
          path: ${{ env.OUTPUT_NAME }}-macOS.zip

  build-android:
    name: Build Android
    needs: test-and-analyze
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    outputs:
      # Tells the release job which APK filename was actually produced so it
      # can be included in the GitHub release without ambiguity.
      apk_name: ${{ steps.collect.outputs.apk_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android-36 + build-tools;36.0.0 are already on the ubuntu-latest image.
      # No sdkmanager calls needed — Flutter and Gradle find them via $ANDROID_HOME.
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Configure Android signing (release path)
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          mkdir -p android
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF
          echo "✅ Release keystore configured"

      - name: Configure Android signing (fallback)
        if: ${{ env.KEYSTORE_BASE64 == '' || env.KEYSTORE_PASSWORD == '' || env.KEY_ALIAS == '' || env.KEY_PASSWORD == '' }}
        run: echo "⚠️ Android release signing secrets are not set. Building debug APK (not signed for Google Play)."

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK — release
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build AAB — release
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build APK — debug fallback
        if: ${{ env.KEYSTORE_BASE64 == '' || env.KEYSTORE_PASSWORD == '' || env.KEY_ALIAS == '' || env.KEY_PASSWORD == '' }}
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Collect Android builds
        id: collect
        run: |
          set -euo pipefail
          mkdir -p android-builds

          # --- APK: prefer release, fall back to debug ---
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            APK_NAME="${{ env.OUTPUT_NAME }}-android.apk"
            cp build/app/outputs/flutter-apk/app-release.apk "android-builds/$APK_NAME"
            echo "✅ Release APK collected: $APK_NAME"
          elif [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            # Keep a consistent name so the release job glob always matches.
            APK_NAME="${{ env.OUTPUT_NAME }}-android-debug.apk"
            cp build/app/outputs/flutter-apk/app-debug.apk "android-builds/$APK_NAME"
            echo "⚠️  Debug APK collected (no signing secrets): $APK_NAME"
          else
            echo "ERROR: No APK found after build step."
            exit 1
          fi
          # Expose the filename to the release job via job output.
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

          # --- AAB: release only, not required ---
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab \
               "android-builds/${{ env.OUTPUT_NAME }}-android.aab"
            echo "✅ Release AAB collected"
          else
            echo "ℹ️  No AAB produced (expected when signing secrets are absent)."
          fi

          echo "== android-builds contents =="
          ls -lh android-builds/

      - name: Upload to Google Play
        if: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.vault_the_spire
          releaseFiles: android-builds/${{ env.OUTPUT_NAME }}-android.aab
          track: internal
          status: completed

      - uses: actions/upload-artifact@v6
        with:
          name: android-builds
          path: android-builds/

  release:
    name: Publish release
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Download each artifact into its own subdirectory by name. The `name`
      # parameter is required here; without it download-artifact@v4 downloads
      # ALL artifacts (including coverage-report) and the multiline `pattern`
      # filter used previously is not reliably supported.
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows-x64

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: artifacts/linux-x64

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: artifacts/macos-x64

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: artifacts/android-builds

      - name: Verify artifacts
        run: |
          echo "== downloaded artifacts =="
          find artifacts -type f | sort

          # Hard-fail if any expected directory is empty or missing.
          for dir in windows-x64 linux-x64 macos-x64 android-builds; do
            count=$(find "artifacts/$dir" -type f 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "ERROR: artifacts/$dir is empty or missing."
              exit 1
            fi
          done

      - name: Generate checksum manifest
        run: |
          cd artifacts
          find . -type f | sort | xargs sha256sum > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          body: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.is_prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            artifacts/windows-x64/*.zip
            artifacts/linux-x64/*.zip
            artifacts/macos-x64/*.zip
            artifacts/android-builds/*
            SHA256SUMS.txt