name: vault_the_spire
description: "TorrentSpire AI - torrent manager with AI copilot"
publish_to: 'none'
version: 4.2.1+421

environment:
  sdk: ^3.11.0

license: GPL-3.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cryptography: ^2.7.0
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0
  go_router: ^17.1.0
  uuid: ^4.3.0
  sqflite: ^2.3.0
  audioplayers: ^6.6.0
  sqlcipher_flutter_libs: ^0.6.8
  sqlite3: ^3.0.0
  path_provider: ^2.1.0
  path: ^1.8.3
  http: ^1.0.0
  permission_handler: ^12.0.0
  sqflite_common_ffi: ^2.3.0
  shared_preferences: ^2.0.20
  tray_manager: ^0.5.2
  collection: ^1.18.0
  window_manager: ^0.5.1
  desktop_drop: ^0.4.0
  file_picker: ^10.3.10
  get_it: ^9.2.1
  win32: ^5.15.0
  webview_flutter: ^4.13.1
  url_launcher: ^6.1.10
  webview_windows: ^0.4.0
  b_encode_decode: ^1.0.5
  dtorrent_task_v2: ^0.4.8
  dtorrent_common: ^1.0.8
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^18.0.0
  dio: ^5.4.3
  flutter_markdown_plus: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

dependency_overrides:
  dtorrent_task_v2:
    path: third_party/dtorrent_task_v2
  bittorrent_dht:
    path: third_party/bittorrent_dht

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#1a1a2e"
  image: assets/icon/app_icon.png
  android_12:
    color: "#1a1a2e"
    icon_background_color: "#1a1a2e"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.ico
    - assets/icons/favicon-192x192.png
    - assets/sounds/click.mp3
    - assets/sounds/send.mp3
    - assets/sounds/notification.mp3